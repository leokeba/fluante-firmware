<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Reach a Fluante over USB or the network, or install its firmware on a board: TesserUI's launcher." />
    <title>Fluante</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <!-- TesserUI's bundle, published by .github/workflows/release.yml with the
         firmware it serves, and built into the bridge's executables. A
         launcher: it opens ?api=, or the Fluante the user picks (TesserUI's
         DESIGN.md section 9.7). It installs the latest releases over USB,
         which the workflow copies next to it, then sets up the Fluante's
         Wi-Fi (section 9.7.1). -->
    <script>
      window.TESSER = {
        launcher: true,
        title: 'Fluante',
        firmware: {
          images: [
            {
              label: 'Fluante',
              asset: 'fluante-{target}-factory.bin',
              description:
                'A classic ESP32 with a TMC2209 and a strobe. Installing resets the settings; the motor stays off until turned on.',
            },
          ],
          wifi: '/sys/network/wifi',
        },
        // Nearby links to the bridge's executables on this repository's
        // latest release (release.yml's bridge job).
        bridge: { repo: 'leokeba/fluante-firmware', name: 'fluante-bridge' },
      };
    </script>
    <script src="ui.js"></script>
  </body>
</html>
